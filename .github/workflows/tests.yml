name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.3"

jobs:
  unit:
    name: ${{ matrix.os == 'macos-latest' && format('macOS Python {0}', matrix.python-version) || format('Python {0}', matrix.python-version) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            extra: all
          - os: macos-latest
            python-version: "3.12"
            extra: plot

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv and dependency cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: python-${{ matrix.python-version }}-${{ runner.os }}-${{ matrix.extra || 'plot' }}-unit
          cache-dependency-glob: uv.lock

      - name: Install locked test environment
        run: |
          uv sync --locked --extra test --extra ${{ matrix.extra || 'plot' }}

      - name: Run unit tests
        run: uv run --no-sync python -m pytest -q

  quality:
    name: Static and package checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv and dependency cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: python-3.12-all
          cache-dependency-glob: uv.lock

      - name: Install locked quality environment
        run: |
          uv sync --locked --extra test --extra all

      - name: Run static checks
        run: |
          uv run --no-sync ruff check src tests scripts
          uv run --no-sync ruff format --check src tests scripts
          uv run --no-sync mypy src

      - name: Verify test coverage
        run: |
          uv run --no-sync coverage run -m pytest -q
          uv run --no-sync coverage report

      - name: Build and test isolated distributions
        run: |
          uv run --no-sync python -m build
          uv run --no-sync python scripts/check_distribution.py

  integration:
    name: ${{ matrix.python-version == '3.12' && 'JCVI/LAST integration' || 'JCVI/LAST integration Python 3.14' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install LAST and BLAST+
        run: |
          sudo apt-get update
          sudo apt-get install --yes last-align ncbi-blast+

      - name: Set up uv and dependency cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: python-${{ matrix.python-version }}-all
          cache-dependency-glob: uv.lock

      - name: Install locked integration environment
        run: |
          uv sync --locked --extra test --extra all

      - name: Run JCVI/LAST integration test
        env:
          KFFRACTBIAS_RUN_INTEGRATION: "1"
        run: uv run --no-sync python -m pytest -q tests/test_compare_integration.py

      - name: Audit locked integration environment
        # JCVI -> genomepy declares diskcache 5.6.3. The advisory has no fixed
        # release and requires an attacker to already have cache-directory
        # write access; kfFractBias does not import or use diskcache.
        run: uv run --no-sync pip-audit --local --skip-editable --ignore-vuln PYSEC-2026-2447
