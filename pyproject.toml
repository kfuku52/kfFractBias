[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "kffractbias"
version = "0.1.4"
description = "Offline fractionation-bias analysis from precomputed synteny or genome annotations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Blake L. Joyce" },
  { name = "Asher Haug-Baltzell" },
  { name = "Sean Davey" },
  { name = "Matthew Bomhoff" },
  { name = "James C. Schnable" },
  { name = "Eric Lyons" },
]
maintainers = [{ name = "kfuku52" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.9,<3.11"]
compare = [
  "jcvi>=1.6.6,<1.7",
  "matplotlib>=3.9,<3.11",
  "mysql-connector-python>=9.1,<10",
]
all = [
  "jcvi>=1.6.6,<1.7",
  "matplotlib>=3.9,<3.11",
  "mysql-connector-python>=9.1,<10",
]
test = [
  "build==1.3.0",
  "coverage[toml]==7.10.7",
  "mypy==1.18.2",
  "pip-audit==2.10.1",
  "pytest==9.0.3",
  "ruff==0.16.3",
]

[project.scripts]
kffractbias = "kffractbias.cli:main"

[project.urls]
Homepage = "https://github.com/kfuku52/kfFractBias"
Source = "https://github.com/kfuku52/kfFractBias"
Upstream = "https://github.com/bjoyce3/SynMapFractBiasAnalysis"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4"]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
no_site_packages = true
python_version = "3.11"
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["src/kffractbias"]

[tool.coverage.report]
fail_under = 80
show_missing = true
