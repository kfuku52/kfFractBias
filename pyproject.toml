[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kffractbias"
version = "0.1.3"
description = "Offline fractionation-bias analysis from precomputed synteny or genome annotations"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "MIT License" }
authors = [
  { name = "Blake L. Joyce" },
  { name = "Asher Haug-Baltzell" },
  { name = "Sean Davey" },
  { name = "Matthew Bomhoff" },
  { name = "James C. Schnable" },
  { name = "Eric Lyons" },
]
maintainers = [{ name = "kfuku52" }]
dependencies = [
  "jcvi",
  "matplotlib",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
test = ["pytest", "ruff"]

[project.scripts]
kffractbias = "kffractbias.cli:main"

[project.urls]
Homepage = "https://github.com/kfuku52/kfFractBias"
Source = "https://github.com/kfuku52/kfFractBias"
Upstream = "https://github.com/bjoyce3/SynMapFractBiasAnalysis"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
